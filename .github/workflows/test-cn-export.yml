name: Test CN exporter

on:
  workflow_dispatch:
  push:
    paths: ['tools/**', 'tests/**', 'schema/**', 'CN/server/**', 'requirements.txt', '.github/workflows/test-cn-export.yml']
  pull_request:
    paths: ['tools/**', 'tests/**', 'schema/**', 'CN/server/**', 'requirements.txt', '.github/workflows/test-cn-export.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
