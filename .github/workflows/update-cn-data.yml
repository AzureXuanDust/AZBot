name: Update CN data

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force regeneration even when AzurLaneLuaScripts has not changed
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 */6 * * *'

permissions:
  actions: write
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: update-cn-data
  cancel-in-progress: false

jobs:
  update:
    name: Generate CN data
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.commit_generated.outputs.has_changes }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout data repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Checkout AzurLaneLuaScripts
        uses: actions/checkout@v5
        with:
          repository: AzurLaneTools/AzurLaneLuaScripts
          path: AzurLaneLuaScripts
          filter: blob:none
          sparse-checkout: |
            CN
            versions
          sparse-checkout-cone-mode: true

      - name: Check upstream revision
        id: upstream
        run: |
          current_commit="$(git -C "${GITHUB_WORKSPACE}/AzurLaneLuaScripts" rev-parse HEAD)"
          previous_commit=""
          if [ -f "${GITHUB_WORKSPACE}/generated/source.json" ]; then
            previous_commit="$(sed -n 's/.*"commit": "\([^"]*\)".*/\1/p' "${GITHUB_WORKSPACE}/generated/source.json" | head -n 1)"
          fi

          echo "current_commit=${current_commit}" >> "${GITHUB_OUTPUT}"
          echo "previous_commit=${previous_commit}" >> "${GITHUB_OUTPUT}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "should_generate=true" >> "${GITHUB_OUTPUT}"
            echo "Force regeneration requested."
          elif [ -n "${previous_commit}" ] && [ "${current_commit}" = "${previous_commit}" ]; then
            echo "should_generate=false" >> "${GITHUB_OUTPUT}"
            echo "AzurLaneLuaScripts unchanged: ${current_commit}"
          else
            echo "should_generate=true" >> "${GITHUB_OUTPUT}"
            echo "AzurLaneLuaScripts changed: ${previous_commit:-<none>} -> ${current_commit}"
          fi

      - name: Set up Node.js
        if: steps.upstream.outputs.should_generate == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Generate CN data
        if: steps.upstream.outputs.should_generate == 'true'
        run: |
          node "azurlua2json-node/cli.mjs" \
            --server CN \
            --lua-root "${GITHUB_WORKSPACE}/AzurLaneLuaScripts" \
            --template-root "${GITHUB_WORKSPACE}/data" \
            --out "${GITHUB_WORKSPACE}/generated" \
            --force \
            --include-new \
            --compare
          rm -f "${GITHUB_WORKSPACE}/generated/change_report.txt"
          cat > "${GITHUB_WORKSPACE}/generated/source.json" <<EOF
          {
            "AzurLaneLuaScripts": {
              "repository": "AzurLaneTools/AzurLaneLuaScripts",
              "server": "CN",
              "commit": "${{ steps.upstream.outputs.current_commit }}"
            }
          }
          EOF

      - name: Show changes
        if: steps.upstream.outputs.should_generate == 'true'
        run: git status --short -- generated

      - name: Commit updated CN data
        id: commit_generated
        if: steps.upstream.outputs.should_generate == 'true'
        run: |
          # Only data files (everything except source.json) trigger a release;
          # a changed upstream pointer alone must not publish an empty version.
          # The '^##' filter drops the branch header that git status --short
          # always prints (even with a pathspec), which would otherwise make
          # the emptiness check below always fail.
          data_changes="$(git status --short -- generated | grep -v '^##' | grep -v 'generated/source.json$' || true)"

          if [ -z "${data_changes}" ]; then
            echo "No generated data changes."
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            # Still commit the source.json pointer so upstream-change detection
            # stays accurate, but skip the release/upload entirely.
            if [ -n "$(git status --short -- generated/source.json | grep -v '^##' || true)" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -A generated
              git commit -m "Track upstream revision (no data changes)"
              git push
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A generated
          git commit -m "Update generated CN data"
          git push
          echo "has_changes=true" >> "${GITHUB_OUTPUT}"

      - name: Generate version
        id: version
        if: steps.commit_generated.outputs.has_changes == 'true'
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" =~ ^v[0-9] ]]; then
            VERSION="${{ github.ref_name }}"
          else
            DATE_VERSION=$(TZ=Asia/Shanghai date +%Y.%m.%d-%H.%M)
            SHORT_SHA="${{ github.sha }}"
            SHORT_SHA="${SHORT_SHA:0:7}"
            VERSION="v${DATE_VERSION}-${SHORT_SHA}"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Version: ${VERSION}"

      - name: Package release zip
        if: steps.commit_generated.outputs.has_changes == 'true'
        run: |
          rm -rf release
          mkdir -p release
          rsync -a --delete --exclude='source.json' "generated/" "release/Resources/"
          (cd release && zip -r "Resources-${VERSION}.zip" Resources)

      - name: Publish release
        if: steps.commit_generated.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${VERSION}" \
            "release/Resources-${VERSION}.zip#Resources-${VERSION}.zip" \
            --title "${VERSION}" \
            --notes "CN data generated from AzurLaneLuaScripts ${{ steps.upstream.outputs.current_commit }}"

      - name: Prune old releases (keep only latest)
        if: steps.commit_generated.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # 优雅路线：GitHub 上只保留当前这一个 release/tag，其余全删
          gh release list --repo "${GITHUB_REPOSITORY}" --limit 200 --json tagName --jq '.[].tagName' \
            | while read -r tag; do
                if [ -n "${tag}" ] && [ "${tag}" != "${VERSION}" ]; then
                  echo "删除旧 release: ${tag}"
                  gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
                fi
              done

      - name: Keep latest 5 workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow "update-cn-data.yml" \
            --limit 100 \
            --json databaseId,status,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:][] | select(.status == "completed") | .databaseId' \
            | while read -r run_id; do
                if [ -n "${run_id}" ]; then
                  gh run delete "${run_id}" --repo "${GITHUB_REPOSITORY}"
                fi
              done

  upload-to-lanzou:
    name: Upload to LanZouCloud
    needs: update
    if: needs.update.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download release package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.update.outputs.version }}
        run: |
          mkdir -p release-packages
          gh release download "${RELEASE_TAG}" --pattern "Resources-*.zip" --dir release-packages
          if [ ! "$(ls -A release-packages)" ]; then
            exit 1
          fi

      - name: Checkout LanZouCloud API repository
        uses: actions/checkout@v5
        with:
          repository: AzureXuanVerse/LanZouCloud-API
          token: ${{ secrets.GH_PAT }}
          path: lanzou-api-repo

      - name: Install LanZouCloud API dependencies
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet requests requests_toolbelt aiohttp asyncio
          SITE_PACKAGES=$(python -c "import site; print(site.getsitepackages()[0])")
          cp -r lanzou-api-repo/lanzou_windfollowingheart "$SITE_PACKAGES/"
          python -c "from lanzou_windfollowingheart.api import LanZouCloud"

      - name: Prepare upload script
        run: |
          if [ ! -f "lanzou-api-repo/lanzou_upload_workflow.py" ]; then
            exit 1
          fi
          cp lanzou-api-repo/lanzou_upload_workflow.py .

      - name: Upload to LanZouCloud
        env:
          LANZOU_YLOGIN: ${{ secrets.LANZOU_YLOGIN }}
          LANZOU_PHPDISK_INFO: ${{ secrets.LANZOU_PHPDISK_INFO }}
          PROJECT_NAME: "Belfast"
        run: python lanzou_upload_workflow.py

  upload-to-r2:
    name: Upload to Cloudflare R2
    needs: update
    if: needs.update.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: tianjg-update
      R2_PREFIX: Azurl
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # 新版 aws-cli v2 默认给上传加 CRC 校验，R2 会拒；只在服务端要求时才算
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED

    steps:
      - name: Download release package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.update.outputs.version }}
        run: |
          mkdir -p release-packages
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "Resources-*.zip" --dir release-packages
          ls -l release-packages

      - name: Upload archive + latest.json, prune old
        env:
          VERSION: ${{ needs.update.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-packages/Resources-*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "未找到 Resources-*.zip"; exit 1
          fi
          archive="${files[0]}"
          name="$(basename "${archive}")"
          size="$(stat -c %s "${archive}")"
          sha="$(sha256sum "${archive}" | cut -d' ' -f1)"
          base="s3://${R2_BUCKET}/${R2_PREFIX}"
          echo "上传 ${name}（${size} 字节, sha256=${sha}）"

          # 1) 新包：文件名带版本，URL 唯一，可长缓存
          aws s3 cp "${archive}" "${base}/${name}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type application/zip \
            --cache-control "public, max-age=31536000, immutable"

          # 2) latest.json：固定名，短缓存，避免 CDN 缓存住旧版本
          printf '{"version":"%s","archive":"%s","size":%s,"sha256":"%s"}\n' \
            "${VERSION}" "${name}" "${size}" "${sha}" > latest.json
          aws s3 cp latest.json "${base}/latest.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type application/json \
            --cache-control "no-cache, max-age=30"

          # 3) 优雅路线：删掉同前缀下其它旧 Resources-*.zip，只留当前版本
          aws s3 rm "${base}/" --recursive \
            --endpoint-url "${R2_ENDPOINT}" \
            --exclude "*" --include "Resources-*.zip" --exclude "${name}"

