name: Update CN data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: update-cn-data
  cancel-in-progress: false

jobs:
  update:
    name: Generate CN data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout data repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Restore AzurLaneLuaScripts cache
        uses: actions/cache@v4
        with:
          path: AzurLaneLuaScripts
          key: azurlane-lua-scripts-cn-${{ github.run_id }}
          restore-keys: |
            azurlane-lua-scripts-cn-

      - name: Checkout AzurLaneLuaScripts
        uses: actions/checkout@v5
        with:
          repository: AzurLaneTools/AzurLaneLuaScripts
          path: AzurLaneLuaScripts
          filter: blob:none
          sparse-checkout: |
            CN
            versions
          sparse-checkout-cone-mode: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Generate CN data
        run: |
          node "azurlua2json-node/cli.mjs" \
            --server CN \
            --lua-root "${GITHUB_WORKSPACE}/AzurLaneLuaScripts" \
            --template-root "${GITHUB_WORKSPACE}/data" \
            --out "${GITHUB_WORKSPACE}/out/generated" \
            --force \
            --compare

      - name: Replace data directory
        run: |
          rsync -a --delete --exclude='change_report.txt' "out/generated/" "data/"

      - name: Show changes
        run: git status --short -- data

      - name: Commit updated CN data
        run: |
          if git diff --quiet -- data; then
            echo "No data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update CN data"
          git push
